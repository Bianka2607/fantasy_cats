<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Fantasy Cats</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Fantasy Cats</h1>
        <nav><a href="index.html">Voltar ao início</a></nav>
    </header>

    <main class="pagina-formulario">
        <form id="reservaForm">
            <h2>Reservar uma mesa</h2>
            <label for="nomeReserva">Seu nome</label>
            <input type="text" id="nomeReserva" required>

            <label for="data">Data</label>
            <input type="date" id="data" required>

            <label for="horario">Horário</label>
            <input type="time" id="horario" required>

            <label for="pessoas">Quantidade de pessoas</label>
            <input type="number" id="pessoas" min="1" max="10" required>

            <button type="submit">Enviar reserva</button>
            <p id="mensagem"></p>
        </form>
    </main>
    <script src="js/reserva.js"></script>
</body>
</html>
