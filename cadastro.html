<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Fantasy Cats</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Fantasy Cats</h1>

        <nav>
            <a href="index.html">Voltar ao cardápio</a>
        </nav>
    </header>

    <main class="pagina-formulario">

        <form id="cadastroForm">

            <h2>Faça parte da Fantasy Cats!</h2>

            <p class="texto-cadastro">
                Crie sua conta para aproveitar nossas delícias e conhecer nosso cardápio.
            </p>

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                placeholder="(00) 00000-0000"
                required
            >

            <label for="senhaCadastro">Crie uma senha</label>
            <input
                type="password"
                id="senhaCadastro"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">Criar minha conta</button>

            <p id="mensagem"></p>

            <p class="link-login">
                Já possui uma conta?
                <a href="login.html">Faça login</a>
            </p>

        </form>

    </main>

    <script src="js/cadastro.js"></script>

</body>
</html>
