<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fantasy Cats</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Fantasy Cats</h1>
        <nav>
            <a href="index.html">Voltar ao início</a>
        </nav>
    </header>

    <main class="pagina-login">

        <section class="login-imagem">
            <img src="img/cafeteria-fundo.jpg"
                 alt="Interior aconchegante da Fantasy Cats">

            <div class="login-texto">
                <h2>Bem-vindo ao Fantasy Cats!</h2>
                <p>Um cantinho especial para quem ama café, doces e gatinhos.</p>
            </div>
        </section>

        <section class="login-conteudo">

            <form id="loginForm">

                <h2>Entrar na conta</h2>

                <p class="subtitulo-login">
                    Acesse sua conta para aproveitar nosso cardápio.
                </p>

                <label for="usuario">E-mail</label>
                <input
                    type="email"
                    id="usuario"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <div class="esqueci-senha">
                    <a href="recuperar-senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <p id="mensagem"></p>

                <p class="cadastro-login">
                    Ainda não tem conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </p>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
